<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="913"><rect width="1400" height="913" fill="#f6f4fb"/><g fill="#262235" font-family="Menlo,monospace" font-size="16"><text x="24" y="34">DXY-023 · 源码文字证据（非界面截图）</text><text x="24" y="65">app/src/main/java/cn/dxy/idxyer/biz/post/dynamic/DynamicPostActivity.kt:222–253</text><text x="24" y="94">9775121032a08a239e6b7a7ba34110136f77506c · 待目标版本运行截图复核</text><text x="24" y="130" xml:space="preserve">222      /** 文字先落成本地图再进编辑器，不在这一步上传。表情用原 Spannable，避免只画出 [dxmm_xx]。本地出图不是耗时操作，不盖加载层。 */</text><text x="24" y="154" xml:space="preserve">223      private fun generateAndOpen() {</text><text x="24" y="178" xml:space="preserve">224          val content = binding.dynamicInput.text ?: return</text><text x="24" y="202" xml:space="preserve">225          if (content.toString().trim().isEmpty()) return</text><text x="24" y="226" xml:space="preserve">226          collapseInput()</text><text x="24" y="250" xml:space="preserve">227          val padding = resources.getDimensionPixelSize(R.dimen.ndp_32)</text><text x="24" y="274" xml:space="preserve">228          val canvasWidth = resources.getDimensionPixelSize(R.dimen.ndp_1) * CARD_WIDTH_DP</text><text x="24" y="298" xml:space="preserve">229          val canvasHeight = resources.getDimensionPixelSize(R.dimen.ndp_1) * CARD_HEIGHT_DP</text><text x="24" y="322" xml:space="preserve">230          val column = (canvasWidth - padding * 2).coerceAtLeast(1)</text><text x="24" y="346" xml:space="preserve">231          // 成图用资源库原色引号。输入框白底上的引号仍单独着 n_3。</text><text x="24" y="370" xml:space="preserve">232          val quote = ContextCompat.getDrawable(this, R.drawable.dynamic_bg_element)?.mutate()</text><text x="24" y="394" xml:space="preserve">233          val bitmap = DynamicTextImage.render(</text><text x="24" y="418" xml:space="preserve">234              text = content,</text><text x="24" y="442" xml:space="preserve">235              textWidthPx = column,</text><text x="24" y="466" xml:space="preserve">236              largeTextPx = sp(LARGE_TEXT_SP),</text><text x="24" y="490" xml:space="preserve">237              smallTextPx = sp(SMALL_TEXT_SP),</text><text x="24" y="514" xml:space="preserve">238              paddingPx = padding,</text><text x="24" y="538" xml:space="preserve">239              quote = quote,</text><text x="24" y="562" xml:space="preserve">240              quoteWidthPx = resources.getDimensionPixelSize(R.dimen.ndp_50),</text><text x="24" y="586" xml:space="preserve">241              quoteHeightPx = resources.getDimensionPixelSize(R.dimen.ndp_48),</text><text x="24" y="610" xml:space="preserve">242              quoteMarginEndPx = resources.getDimensionPixelSize(R.dimen.ndp_20),</text><text x="24" y="634" xml:space="preserve">243              quoteMarginBottomPx = resources.getDimensionPixelSize(R.dimen.ndp_40),</text><text x="24" y="658" xml:space="preserve">244              backgroundColor = ContextCompat.getColor(this, R.color.color_D4DFFB),</text><text x="24" y="682" xml:space="preserve">245              canvasWidthPx = canvasWidth,</text><text x="24" y="706" xml:space="preserve">246              canvasHeightPx = canvasHeight,</text><text x="24" y="730" xml:space="preserve">247          )</text><text x="24" y="754" xml:space="preserve">248          val file = File(cacheDir, &quot;dynamic-text-${System.currentTimeMillis()}.jpg&quot;)</text><text x="24" y="778" xml:space="preserve">249          FileOutputStream(file).use { output -&gt;</text><text x="24" y="802" xml:space="preserve">250              bitmap.compress(android.graphics.Bitmap.CompressFormat.JPEG, 90, output)</text><text x="24" y="826" xml:space="preserve">251          }</text><text x="24" y="850" xml:space="preserve">252          bitmap.recycle()</text><text x="24" y="874" xml:space="preserve">253          openEditor(arrayOf(file.absolutePath), useOrigin = true, title = DynamicTextImage.titleOf(content.toString()))</text></g></svg>