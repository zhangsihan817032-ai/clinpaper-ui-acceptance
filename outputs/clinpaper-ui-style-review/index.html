<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClinPaper 样式验收中心</title>
  <link rel="stylesheet" href="assets/app.css">
  <script src="assets/offline-snapshot.js" defer></script>
  <script src="assets/previews.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <header>
    <a class="brand" href="#records"><span class="logo">C</span><span><strong>ClinPaper 样式验收中心</strong><small>验收记录 · 设计对照 · 修复回归</small></span></a>
    <span id="sync-status" class="sync" role="status" aria-live="polite">正在连接共享状态</span>
  </header>
  <div class="shell">
    <nav aria-label="验收导航">
      <small>WORKSPACE / CLINPAPER</small>
      <a href="#records" data-nav="records">验收记录 <span class="nav-num" id="nav-runs">—</span></a>
      <a href="#issues" data-nav="issues">当前问题总表 <span class="nav-num" id="nav-issues">—</span></a>
      <a href="#trash" data-nav="trash">回收站 <span class="nav-num" id="nav-trash">—</span></a>
      <p>保留每次验收的结论和截图。<br>问题沿用原编号，修复后继续回归。<br>仅验收批次可删除与恢复。</p>
    </nav>
    <main id="content"><p>正在加载验收记录…</p></main>
  </div>
  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>
  <dialog id="viewer"><div class="viewer-bar"><span id="viewer-title">截图原图</span><button type="button" class="btn" id="viewer-close">关闭</button></div><img id="viewer-image" alt="验收截图原图"></dialog>
  <noscript>此验收中心需要启用 JavaScript 才能查看记录和更新问题状态。</noscript>
</body>
</html>
